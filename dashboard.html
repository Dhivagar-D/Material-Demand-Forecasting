
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Inventory Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">
            <h3>📊 Smart Inventory Dashboard</h3>
        </div>

        <div class="card-body">
            <hr class="my-4">

<h4>Demand Forecast</h4>

<div class="row">

    <div class="col-md-3">
        <select id="category" class="form-select">
            <option>Select Category</option>
        </select>
    </div>

    <div class="col-md-3">
        <select id="region" class="form-select">
            <option>Select Region</option>
        </select>
    </div>

    <div class="col-md-3">
        <select id="weather" class="form-select">
            <option>Select Weather</option>
        </select>
    </div>

    <div class="col-md-3">
        <select id="seasonality" class="form-select">
            <option>Select Season</option>
        </select>
    </div>

</div>

<div class="row mt-3">

    <div class="col-md-3">
        <input id="inventory"
               class="form-control"
               placeholder="Inventory">
    </div>

    <div class="col-md-3">
        <input id="price"
               class="form-control"
               placeholder="Price">
    </div>

    <div class="col-md-3">
        <input id="discount"
               class="form-control"
               placeholder="Discount">
    </div>

    <div class="col-md-3">
        <button onclick="predictDemand()"
                class="btn btn-success w-100">
            Predict Demand
        </button>
    </div>

</div>

<hr>

<h4>Prediction Result</h4>

<div class="row">

    <div class="col-md-4">
        <div class="card bg-primary text-white">
            <div class="card-body">
                Predicted Demand
                <h3 id="predictedDemand">0</h3>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-success text-white">
            <div class="card-body">
                Recommended Stock
                <h3 id="recommendedStock">0</h3>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-danger text-white">
            <div class="card-body">
                Inventory Alert
                <h3 id="inventoryAlert">OK</h3>
            </div>
        </div>
    </div>

</div>

<hr>

<h4>Analytics Chart</h4>

<canvas id="analyticsChart"></canvas>

<hr>

<h4>Prediction History</h4>

<table class="table table-bordered">

    <thead>
        <tr>
            <th>ID</th>
            <th>Category</th>
            <th>Region</th>
            <th>Demand</th>
            <th>Alert</th>
        </tr>
    </thead>

    <tbody id="historyBody">
    </tbody>

</table>

            <div class="row">

                <div class="col-md-3">
                    <div class="card bg-success text-white">
                        <div class="card-body text-center">
                            <h5>Total Records</h5>
                            <h2>73100</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card bg-info text-white">
                        <div class="card-body text-center">
                            <h5>Categories</h5>
                            <h2>4</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card bg-warning text-dark">
                        <div class="card-body text-center">
                            <h5>Regions</h5>
                            <h2>4</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card bg-danger text-white">
                        <div class="card-body text-center">
                            <h5>Forecast Avg</h5>
                            <h2>120</h2>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>
<script>
const API = "http://127.0.0.1:10000";

async function loadOptions() {

    try {

        const res = await fetch(API + "/api/options");

        const data = await res.json();

        fillDropdown("category", data.categories);
        fillDropdown("region", data.regions);
        fillDropdown("weather", data.weather);
        fillDropdown("seasonality", data.seasonality);

    } catch (err) {

        console.error("Options Error:", err);

    }
}

function fillDropdown(id, items) {

    const select =
        document.getElementById(id);

    select.innerHTML =
        "<option>Select</option>";

    items.forEach(item => {

        let option =
            document.createElement("option");

        option.value = item;
        option.textContent = item;

        select.appendChild(option);

    });
}

window.onload = loadOptions;
</script>
<script>

async function predictDemand(){

    const payload = {

        "Category":
        document.getElementById("category").value,

        "Region":
        document.getElementById("region").value,

        "Inventory Level":
        parseFloat(
            document.getElementById("inventory").value
        ) || 0,

        "Price":
        parseFloat(
            document.getElementById("price").value
        ) || 0,

        "Discount":
        parseFloat(
            document.getElementById("discount").value
        ) || 0,

        "Weather Condition":
        document.getElementById("weather").value,

        "Seasonality":
        document.getElementById("seasonality").value
    };

    console.log(payload);

    try{

        const response =
        await fetch(
            "http://127.0.0.1:10000/api/predict",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify(payload)
            }
        );

        const data =
        await response.json();

        console.log(data);

        document.getElementById(
            "predictedDemand"
        ).innerHTML =
        data.predicted_demand;

        document.getElementById(
            "recommendedStock"
        ).innerHTML =
        data.recommended_stock;

        document.getElementById(
            "inventoryAlert"
        ).innerHTML =
        "Success";

    }
    catch(error){

        console.error(error);

        alert(
            "Prediction Failed"
        );

    }

}

</script>
</body>
</html>
